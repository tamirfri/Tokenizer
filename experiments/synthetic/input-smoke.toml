name = "synthetic-offline-smoke"
mode = "input_only"
evidence_scope = "synthetic"
device = "cpu"
seed = 17
stages = ["vocabulary", "reconstruction"]

[model]
id = "continuous-tokenizer/synthetic-model"
revision = "synthetic"
evaluation = "full"

[dataset]
id = "continuous-tokenizer/synthetic-bytes"
config = "default"
revision = "synthetic"

[runtime]
corpus_max_rows = 3
cache_chunk_rows = 32
snapshot_interval = 100
projected_run_bytes = 1073741824
storage_reserve_bytes = 1073741824
inductor_cache_estimate_bytes = 1073741824
minimum_mps_memory_bytes = 1073741824

[training]
profile = "small"
batch_size = 256
learning_rate = 0.03
weight_decay = 0.0
vocabulary_epochs = 20
reconstruction_epochs = 2
reconstruction_samples = 64
reconstruction_vocabulary_fraction = 0.75
validation_bytes = 64
patience = 10
evaluation_interval = 1
distillation_epochs = 0
distillation_windows = 0
distillation_prompt_tokens = 2
distillation_continuation_tokens = 1

[evaluation]
batch_size = 8
samples = 2
prompt_tokens = 2
continuation_tokens = 1
generation_samples = 1
max_new_tokens = 1
warmups = 0
repetitions = 1
performance_prompts = 1
tokenizer_repetitions = 1
retrieval_queries = 8
max_test_bytes = 64

[gates]
maximum_normalized_rmse = 0.01
minimum_cosine_p01 = 0.999
minimum_cosine_p50 = 0.9999
minimum_native_tokens_per_continuous_token = 1.10
maximum_candidate_reference_state_ratio = 0.50
maximum_segmented_mean_kl = 0.10
maximum_segmented_nll_delta = 0.10
minimum_segmented_top1_agreement = 0.90
minimum_segmented_generation_byte_similarity = 0.50
