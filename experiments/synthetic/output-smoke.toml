name = "synthetic-output-only-smoke"
mode = "output_only"
evidence_scope = "synthetic"
device = "cpu"
seed = 17
stages = ["output_codec"]

[model]
id = "continuous-tokenizer/synthetic-model"
revision = "synthetic"
evaluation = "full"

[dataset]
id = "continuous-tokenizer/synthetic-bytes"
config = "default"
revision = "synthetic"

[runtime]
corpus_max_rows = 3
cache_chunk_rows = 32
snapshot_interval = 100
projected_run_bytes = 1073741824
storage_reserve_bytes = 1073741824
inductor_cache_estimate_bytes = 1073741824
minimum_mps_memory_bytes = 1073741824

[training]
profile = "small"
max_span = 2
epochs = 10
batch_size = 256
learning_rate = 0.003
weight_decay = 0.0

[evaluation]
batch_size = 8
samples = 1
max_macro_steps = 16
max_output_bytes = 16
warmups = 0
repetitions = 1
prompt_set = "frozen-greedy-fidelity"
prompt_set_sha256 = "a8990030d201c6076ab3eae8425e1f78a51855b19739b723d621acb3dd186ee7"
oracle_span_limits = [1, 2, 4, 8]

[evaluation.training_corpus]
split = "train"
seed = 1701

[evaluation.checkpoint_selection_corpus]
split = "train"
seed = 1702

[evaluation.oracle_validation_corpus]
split = "validation"
seed = 1703

[evaluation.final_test_corpus]
split = "registered_prompts"
seed = 1704

[gates]
minimum_direct_feedback_equality = 1.0
maximum_invalid_events = 0
minimum_valid_non_empty_termination = 1.0
minimum_control_prompt_coverage = 0.25
minimum_control_precision = 1.0
minimum_control_recall = 1.0
minimum_stop_precision = 1.0
minimum_stop_recall = 1.0
minimum_native_tokens_per_attempted_macro_step = 1.10
minimum_rollout_event_agreement = 0.50
maximum_candidate_reference_state_ratio = 256.0
